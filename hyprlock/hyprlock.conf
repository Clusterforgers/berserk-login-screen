# Matches the "berserk-rain" SDDM login theme (/usr/share/sddm/themes/berserk-rain).
# Previous config saved as hyprlock.conf.bak

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = fadeIn, 1, 6, ease
    animation = fadeOut, 1, 4, ease
    animation = inputFieldColors, 1, 3, ease
}

background {
    monitor =
    path = ~/.config/hypr/lockscreen.jpg
    color = rgb(000000)
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "<span letter_spacing='4096'>$(date +'%H:%M')</span>"
    color = rgb(d8d8d8)
    font_size = 64
    font_family = Noto Serif
    position = 0, -72
    halign = center
    valign = top
}

# Date (English, uppercase, like the login screen)
label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='3072'>$(LC_TIME=C date +'%A, %-d %B' | tr a-z A-Z)</span>"
    color = rgb(8a8a8a)
    font_size = 18
    font_family = Noto Serif
    position = 0, -165
    halign = center
    valign = top
}

# Username, in place of the login screen's user field
label {
    monitor =
    text = $USER
    color = rgb(d8d8d8)
    font_size = 16
    font_family = Noto Serif
    position = 0, 214
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 340, 44
    rounding = 2
    outline_thickness = 1
    outer_color = rgb(c4161c)
    inner_color = rgba(000000aa)
    font_color = rgb(d8d8d8)
    font_family = Noto Serif
    check_color = rgb(8a8a8a)
    fail_color = rgb(c4161c)
    fail_text = <span foreground="##c4161c">Login failed</span>
    capslock_color = rgb(c4161c)
    placeholder_text = <span foreground="##666666">Password</span>
    dots_center = true
    dots_size = 0.25
    dots_spacing = 0.4
    fade_on_empty = false
    position = 0, 152
    halign = center
    valign = bottom
}
